# Runtime JDBC queries. All entity primary keys are id; foreign keys use fk_id_<entity>.

workflow-definition:
  find-latest-active-id: |
    SELECT id
    FROM workflow_brain.workflow_definition
    WHERE workflow_key = :workflowKey AND status = 'ACTIVE'
    ORDER BY version DESC
    LIMIT 1
  find-metadata: |
    SELECT workflow_key, version
    FROM workflow_brain.workflow_definition
    WHERE id = :definitionId
  find-state-actions: |
    SELECT state.state_code, state_action.fk_id_workflow_action, action.action_name, state_action.phase, state_action.execution_order
    FROM workflow_brain.workflow_state_action state_action
    JOIN workflow_brain.workflow_state state ON state.id = state_action.fk_id_workflow_state
    JOIN workflow_brain.workflow_action action ON action.id = state_action.fk_id_workflow_action
    WHERE state.fk_id_workflow_definition = :definitionId
    ORDER BY state.state_code, state_action.phase, state_action.execution_order
  find-states: |
    SELECT state_code, initial_state, terminal_state
    FROM workflow_brain.workflow_state
    WHERE fk_id_workflow_definition = :definitionId
    ORDER BY state_code
  find-transition-actions: |
    SELECT transition_action.fk_id_workflow_transition, action.action_name
    FROM workflow_brain.workflow_transition_action transition_action
    JOIN workflow_brain.workflow_transition transition ON transition.id = transition_action.fk_id_workflow_transition
    JOIN workflow_brain.workflow_action action ON action.id = transition_action.fk_id_workflow_action
    WHERE transition.fk_id_workflow_definition = :definitionId
    ORDER BY transition_action.fk_id_workflow_transition, transition_action.execution_order
  find-transitions: |
    SELECT transition.id, source_state.state_code AS source_state, transition.event_code,
           target_state.state_code AS target_state, transition.transition_kind
    FROM workflow_brain.workflow_transition transition
    JOIN workflow_brain.workflow_state source_state ON source_state.id = transition.fk_id_source_workflow_state
    JOIN workflow_brain.workflow_state target_state ON target_state.id = transition.fk_id_target_workflow_state
    WHERE transition.fk_id_workflow_definition = :definitionId
    ORDER BY transition.id

transition-history:
  insert: |
    INSERT INTO workflow_brain.workflow_transition_history
    (event_code, request_id, idempotency_key, fk_id_workflow_instance, fk_id_workflow_definition, fk_id_source_workflow_state, fk_id_target_workflow_state)
    SELECT :event, :requestId, :idempotencyKey, instance.id, :definitionId, source_state.id, target_state.id
    FROM workflow_brain.workflow_instances instance
    JOIN workflow_brain.workflow_state source_state
        ON source_state.fk_id_workflow_definition = instance.fk_id_workflow_definition AND source_state.state_code = :sourceState
    JOIN workflow_brain.workflow_state target_state
        ON target_state.fk_id_workflow_definition = instance.fk_id_workflow_definition AND target_state.state_code = :targetState
    WHERE instance.reference_id = :referenceId AND instance.fk_id_workflow_definition = :definitionId

workflow-instance:
  insert: |
    INSERT INTO workflow_brain.workflow_instances (reference_id, fk_id_workflow_definition, fk_id_workflow_state)
    SELECT :reference, :definition, state.id
    FROM workflow_brain.workflow_state state
    WHERE state.fk_id_workflow_definition = :definition AND state.state_code = :state
  find-and-lock-by-reference: |
    SELECT instance.id, instance.reference_id, instance.fk_id_workflow_definition, state.state_code AS current_state
    FROM workflow_brain.workflow_instances instance
    JOIN workflow_brain.workflow_state state ON state.id = instance.fk_id_workflow_state
    WHERE instance.reference_id = :reference
    FOR UPDATE OF instance
  find-by-reference: |
    SELECT instance.id, instance.reference_id, instance.fk_id_workflow_definition, state.state_code AS current_state
    FROM workflow_brain.workflow_instances instance
    JOIN workflow_brain.workflow_state state ON state.id = instance.fk_id_workflow_state
    WHERE instance.reference_id = :reference
  update-current-state: |
    UPDATE workflow_brain.workflow_instances instance
    SET fk_id_workflow_state = state.id, updated_at = CURRENT_TIMESTAMP
    FROM workflow_brain.workflow_state state
    WHERE instance.reference_id = :reference
      AND state.fk_id_workflow_definition = instance.fk_id_workflow_definition AND state.state_code = :state
