spring:
  application:
    name: state-machine-brain

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/workflow}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    default-schema: workflow_brain
    schemas: workflow_brain
    create-schemas: true

server:
  port: ${SERVER_PORT:8081}

logging:
  pattern:
    level: '%5p [correlationId:%X{correlationId:-} requestId:%X{requestId:-}]'
