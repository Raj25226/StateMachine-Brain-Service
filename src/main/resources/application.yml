spring:
  application:
    name: state-machine-brain

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/workflow}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${COMMON_DS_CACHE_REDIS_HOST:localhost}
      port: ${COMMON_DS_CACHE_REDIS_PORT:6379}
      password: ${COMMON_DS_CACHE_REDIS_PASSWORD:}
      ssl:
        enabled: ${COMMON_DS_REDIS_TLS_ENABLED:false}
      ca-cert: ${COMMON_DS_REDIS_CA_CERT:}
      connect-timeout: 2s
      timeout: 2s

  flyway:
    enabled: true
    default-schema: workflow_brain
    schemas: workflow_brain
    create-schemas: true

server:
  port: ${SERVER_PORT:8081}

logging:
  pattern:
    level: '%5p [correlationId:%X{correlationId:-} requestId:%X{requestId:-}]'

acl:
  base-url: ${ACL_BASE_URL:http://localhost:8082}
  timeout: ${ACL_TIMEOUT:10s}

workflow:
  idempotency:
    ttl-minutes: ${IDEMPOTENCY_TTL_MINUTES:120}
